services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pizza
      POSTGRES_USER: pizza
      POSTGRES_PASSWORD: pizza
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U pizza -d pizza"]
      interval: 5s
      timeout: 5s
      retries: 10
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
